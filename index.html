    <script>
      // Fallback redirect for GitHub Pages: If served from repository root without a build step,
      // redirect immediately to the compiled /docs/ build so the page is never blank
      (function() {
        if (typeof window !== 'undefined' && window.location.hostname.endsWith('github.io')) {
          var pathname = window.location.pathname;
          if (!pathname.includes('/docs') && !pathname.includes('/dist')) {
            var segments = pathname.split('/').filter(Boolean);
            var repo = segments.length > 0 ? segments[0] : '';
            var target = (repo ? '/' + repo + '/docs/' : '/docs/') + window.location.search + window.location.hash;
            window.location.replace(target);
          }
        }
      })();
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
