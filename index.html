<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="Premium e-commerce store for WiZ Home Hygiene &amp; Personal Care products with multi-variant options, instant WhatsApp &amp; marketplace order enquiries." />
    <meta property="og:title" content="WiZ Home Hygiene &amp; Personal Care" />
    <meta property="og:description" content="Premium e-commerce store for WiZ Home Hygiene &amp; Personal Care products with multi-variant options, instant WhatsApp &amp; marketplace order enquiries." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700;800&family=Inter:wght@300;400;500;600;700;800&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
    <script>
      // Universal Image Path Auto-Healer:
      // Dynamically catches and repairs broken /assets/... and legacy public/assets/... image requests
      // ensuring all product images, banners, and logos resolve correctly across GitHub Pages and custom domains.
      document.addEventListener('error', function(event) {
        var target = event.target;
        if (target && target.tagName === 'IMG') {
          var src = target.getAttribute('src');
          if (!src || target.dataset.wizRetried) return;
          target.dataset.wizRetried = 'true';

          var isAsset = src.indexOf('assets/') !== -1 || src.indexOf('public/') !== -1;
          if (isAsset) {
            var clean = src.replace(/^https?:\/\/[^/]+/i, '');
            var markerIdx = clean.toLowerCase().indexOf('assets/');
            if (markerIdx !== -1) {
              clean = clean.substring(markerIdx + 7);
            } else {
              clean = clean.replace(/^(\/?public\/)/i, '').replace(/^(\.\/|\/)+/, '');
            }
            try {
              clean = clean.split('/').map(function(s) {
                return s ? encodeURI(decodeURI(s)) : '';
              }).filter(Boolean).join('/');
            } catch (e) {
              clean = encodeURI(clean);
            }

            var isGH = window.location.hostname.endsWith('github.io');
            var segments = window.location.pathname.split('/').filter(Boolean);
            var distIdx = segments.indexOf('dist-static');
            var basePrefix = '/';
            if (isGH) {
              if (distIdx !== -1) {
                basePrefix = '/' + segments.slice(0, distIdx + 1).join('/') + '/';
              } else if (segments.length > 0 && segments[0] !== 'assets') {
                basePrefix = '/' + segments[0] + '/';
              }
            } else if (distIdx !== -1) {
              basePrefix = '/' + segments.slice(0, distIdx + 1).join('/') + '/';
            }
            var resolved = basePrefix + 'assets/' + clean;
            if (target.getAttribute('src') !== resolved) {
              target.style.display = '';
              target.setAttribute('src', resolved);
            }
          }
        }
      }, true);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // GitHub Pages static branch fallback:
      // Only activates when serving uncompiled root index.html (where Vite has NOT replaced /src/main.tsx).
      (function() {
        var devScript = document.querySelector('script[src="/src/main.tsx"]');
        if (!devScript) return;

        var redirected = false;
        var redirectToDistStatic = function() {
          if (redirected) return;
          var root = document.getElementById('root');
          if (root && root.childElementCount > 0) return;
          var path = window.location.pathname;
          if (path.indexOf('/dist-static') !== -1) return;
          redirected = true;
          var basePath = path.endsWith('/') ? path : path.replace(/\/[^/]*$/, '/');
          if (!basePath.endsWith('/')) basePath += '/';
          window.location.replace(basePath + 'dist-static/' + window.location.hash);
        };

        devScript.addEventListener('error', redirectToDistStatic);
        setTimeout(function() {
          if (window.location.hostname.endsWith('github.io')) {
            redirectToDistStatic();
          }
        }, 800);
      })();
    </script>
  </body>
</html>
