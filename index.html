    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700;800&family=Inter:wght@300;400;500;600;700;800&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script type="module">
      // GitHub Pages static branch fallback:
      // If served uncompiled on GitHub Pages root, redirect to pre-built dist-static/ bundle
      if (typeof window !== 'undefined' && window.location.hostname.endsWith('github.io')) {
        setTimeout(function() {
          var root = document.getElementById('root');
          if (root && root.childElementCount === 0) {
            var segments = window.location.pathname.split('/').filter(Boolean);
            var repo = segments.length > 0 ? segments[0] : '';
            var dest = (repo ? '/' + repo + '/dist-static/' : '/dist-static/') + window.location.hash;
            window.location.replace(dest);
          }
        }, 400);
      }
    </script>
  </body>
</html>
