<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WiZ Home Hygiene &amp; Personal Care</title>
    <script>
      // Single Page App redirect for GitHub Pages
      (function() {
        var path = window.location.pathname;
        var segments = path.split('/').filter(Boolean);
        var repo = segments.length > 0 ? segments[0] : '';
        var subpath = segments.slice(1).join('/');

        // Strip any loop fragments like 'docs' or '404'
        if (subpath === 'docs' || subpath.startsWith('docs/') || subpath === '404') {
          subpath = '';
        }

        var base = window.location.hostname.endsWith('github.io') && repo ? '/' + repo : '';
        var targetRoute = subpath ? '/' + subpath : '/';

        // Redirect cleanly without stacking hashes
        window.location.replace(base + '/#' + targetRoute);
      })();
    </script>
    <style>
      body {
        margin: 0;
        padding: 40px 20px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 80vh;
        background-color: #fafafa;
        color: #333;
        text-align: center;
      }
      .card {
        background: white;
        padding: 32px;
        border: 1px solid #e5e7eb;
        max-width: 400px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      }
      .spinner {
        width: 32px;
        height: 32px;
        border: 3px solid #f3e8ff;
        border-top-color: #7a49a6;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 0 auto 16px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      h2 {
        margin: 0 0 8px;
        font-size: 18px;
        color: #111;
      }
      p {
        margin: 0;
        font-size: 14px;
        color: #666;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="spinner"></div>
      <h2>WiZ Hygiene Store</h2>
      <p>Redirecting to store page...</p>
    </div>
  </body>
</html>
